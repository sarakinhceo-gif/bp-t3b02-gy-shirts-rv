        }
        .review-card {
            background: #fff;
            color: #000;
            padding: 32px 24px;
            border: var(--border-thick) solid #000;
            outline: 3px solid var(--accent);

            transform: rotate(var(--rot, 0deg)) skewX(var(--skew, 0deg));

            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        }
        .review-card:nth-child(odd) {
            --rot: -1.2deg;
            --skew: 0.5deg;
